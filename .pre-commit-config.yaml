repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      # uv.lock is generated, and ML dependencies (torch, chromadb, ...) push it past
      # the 500 KB limit; the limit still guards every other file.
      - id: check-added-large-files
        exclude: '(^|/)uv\.lock$'
      - id: detect-private-key

  # Fixers: they fix the staged files and re-stage the fixes instead of failing, and
  # fail only on issues they cannot fix (see devtools/fix-staged.sh).
  # ruff comes from the venv, so it always matches `make lint`.
  - repo: local
    hooks:
      - id: end-of-file-fixer
        name: fix end of files
        entry: devtools/fix-staged.sh end-of-file-fixer --
        language: python
        additional_dependencies: [pre-commit-hooks==6.0.0]
        types: [text]
        stages: [pre-commit]
        require_serial: true
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: devtools/fix-staged.sh trailing-whitespace-fixer --
        language: python
        additional_dependencies: [pre-commit-hooks==6.0.0]
        types: [text]
        stages: [pre-commit]
        require_serial: true
      - id: ruff-check
        name: ruff check --fix
        entry: devtools/fix-staged.sh .venv/bin/ruff check --fix --force-exclude --
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: devtools/fix-staged.sh .venv/bin/ruff format --force-exclude --
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
        require_serial: true

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
        # Enforce Conventional Commits format AND a short subject line.
        # -l 72 limits the first line (header) to the Git hard limit of 72 chars.
        entry: cz check
        args: [--allow-abort, -l, "72", --commit-msg-file]
        stages: [commit-msg]
