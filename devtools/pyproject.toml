[tool.ruff]
line-length = 120
target-version = "py314"
# Markdown is documentation, not source: ruff >= 0.14 formats the Python code
# blocks inside .md files, which rewrites hand-aligned snippets in the docs.
# extend-exclude (not exclude) keeps ruff's own default exclusions in place.
# Self-contained sub-projects (own venv, pyproject and ruff config) lint themselves;
# linting them from here would fight their own config over import sorting.
extend-exclude = ["*.md", "devtools", "04_genai_flask_app"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
