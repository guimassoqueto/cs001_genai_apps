[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-app"
version = "0.1.0"
description = "Flask app that triages customer inquiries with Claude through LangChain"
requires-python = ">=3.14"
dependencies = [
    "flask==3.1.3",
    "flask-caching==2.5.1",
    "langchain-anthropic==1.7.5",
    "python-dotenv>=1.2",
    "gunicorn>=26",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "ruff>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genai_app = ["schema.sql", "templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Expected: one test switches the cache off on purpose.
filterwarnings = ["ignore:Flask-Caching. CACHE_TYPE is set to NullCache:UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
